<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obsidian Bookmarks options</title>
  <style>
    body { font: 14px/1.5 system-ui, -apple-system, sans-serif; color: #222; background: #fff; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; margin: 0 0 1rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input { display: block; width: 100%; box-sizing: border-box; margin-top: .25rem; padding: .5rem; font: inherit; border: 1px solid #bbb; border-radius: 4px; }
    .hint { font-weight: normal; color: #666; font-size: 12px; margin-top: .25rem; }
    .row { display: flex; gap: .5rem; margin-top: 1.5rem; }
    button { padding: .5rem 1rem; font: inherit; border-radius: 4px; border: 1px solid #888; background: #f4f4f4; cursor: pointer; }
    button[type=submit] { background: #5b3fd1; border-color: #5b3fd1; color: #fff; }
    #status { margin-top: 1rem; min-height: 1.5em; }
    #status.ok { color: #2e7d32; }
    #status.err { color: #c62828; }
  </style>
</head>
<body>
  <h1>Obsidian Bookmarks</h1>
  <form id="form">
    <label>API base URL
      <input id="apiBaseUrl" type="text" inputmode="url" placeholder="http://127.0.0.1:27123" autocomplete="off" spellcheck="false">
      <div class="hint">The Local REST API plugin's non-encrypted (HTTP) server. Use 127.0.0.1, not localhost.</div>
    </label>
    <label>API key
      <input id="apiKey" type="password" autocomplete="off" spellcheck="false">
      <div class="hint">Copy it from Obsidian → Settings → Local REST API.</div>
    </label>
    <label>Target note
      <input id="targetNote" type="text" placeholder="Reading List.md" autocomplete="off" spellcheck="false">
      <div class="hint">Vault-relative path. Links are appended to the end; the note is created if missing.</div>
    </label>
    <label>Papers folder
      <input id="papersFolder" type="text" placeholder="Papers" autocomplete="off" spellcheck="false">
      <div class="hint">Vault-relative folder for arXiv PDFs; created automatically if missing.</div>
    </label>
    <div class="row">
      <button type="submit">Save</button>
      <button type="button" id="test">Test connection</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
  <script type="module" src="options.js"></script>
</body>
</html>
